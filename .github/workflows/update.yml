name: Update schedule

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (UTC; GitHub may delay runs a bit)
  workflow_dispatch:        # "Run workflow" button for a manual update
  push:
    branches: [main]

permissions:
  contents: write   # only for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch schedule
        run: python build.py _site/schedule.json

      - name: Add page
        run: cp index.html _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # GitHub disables scheduled workflows in public repos after 60 days without repo activity.
      # An empty commit every ~50 days keeps the hourly updates running.
      - name: Keep alive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $((50*86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keep-alive"
            git push
          fi
